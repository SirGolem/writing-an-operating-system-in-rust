[[bin]]
bench = false
name = "operating-system"
path = "source/main.rs"
test = true

[dependencies]
bootloader = "0.9.35"
lazy_static = { features = ["spin_no_std"], version = "1.5.1" }
pc-keyboard = "0.9.0"
pic8259 = "0.11.0"
spin = "0.12.3"
uart_16550 = "0.9.0"
volatile = "0.2.6"
x86_64 = "0.15.5"

[lib]
name = "operating_system"
path = "source/library.rs"

[package]
edition = "2024"
name = "writing-an-operating-system-in-rust"
version = "0.0.0"

[package.metadata.bootimage]
test-args = [
    "-device",
    "isa-debug-exit,iobase=0xF4,iosize=0x04",
    "-display",
    "none",
    "-serial",
    "stdio",
]
test-success-exit-code = 33
test-timeout = 10

[[test]]
harness = false
name = "should_panic"

[[test]]
harness = false
name = "stack_overflow"
